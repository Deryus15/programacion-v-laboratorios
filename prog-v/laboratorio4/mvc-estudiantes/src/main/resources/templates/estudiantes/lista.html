<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estudiantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">UNACHI · Ejemplo MVC</span>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3">Estudiantes</h1>
            <p class="text-muted mb-0">CRUD con Spring MVC, Thymeleaf y MariaDB</p>
        </div>
        <a class="btn btn-primary" th:href="@{/estudiantes/nuevo}">
            Nuevo estudiante
        </a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/estudiantes}">
        <div class="col-md-9">
            <input class="form-control" type="text" name="buscar"
                   th:value="${buscar}"
                   placeholder="Buscar por nombre o apellido">
        </div>
        <div class="col-md-3 d-grid">
            <button class="btn btn-outline-secondary" type="submit">Buscar</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Cédula</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Correo</th>
                    <th>Carrera</th>
                    <th style="width: 170px;">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${estudiantes}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.cedula}"></td>
                    <td th:text="${e.nombre}"></td>
                    <td th:text="${e.apellido}"></td>
                    <td th:text="${e.correo}"></td>
                    <td th:text="${e.carrera}"></td>
                    <td>
                        <a class="btn btn-sm btn-warning"
                           th:href="@{/estudiantes/editar/{id}(id=${e.id})}">
                            Editar
                        </a>
                        <a class="btn btn-sm btn-danger"
                           th:href="@{/estudiantes/eliminar/{id}(id=${e.id})}"
                           onclick="return confirm('¿Desea eliminar este estudiante?')">
                            Eliminar
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(estudiantes)}">
                    <td colspan="7" class="text-center py-4 text-muted">
                        No hay estudiantes registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
